name: Corriger carte Chez Baptiste adhérent

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  correct-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Corriger cartes et wording
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import re

          fontb='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          font='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          for name in ['carte de visite.png','carte-chez-baptiste-qr.png']:
              p=Path(name)
              if not p.exists():
                  continue
              im=Image.open(p).convert('RGB')
              W,H=im.size
              sx,sy=W/941,H/1672
              s=min(sx,sy)
              d=ImageDraw.Draw(im)
              def R(x1,y1,x2,y2): return (round(x1*sx),round(y1*sy),round(x2*sx),round(y2*sy))
              def F(path,n): return ImageFont.truetype(path,max(10,round(n*s)))
              dark=(4,68,48); gold=(226,165,15); white=(255,251,240); bg=(0,74,49); beige=(243,236,226)
              r=R(31,780,286,877)
              d.rounded_rectangle(r,radius=max(8,round(28*s)),fill=dark,outline=gold,width=max(1,round(3*s)))
              f=F(fontb,31); t='ADHÉRENT'; bb=d.textbbox((0,0),t,font=f)
              d.text(((r[0]+r[2]-(bb[2]-bb[0]))/2,round(796*sy)),t,font=f,fill=white)
              f=F(fontb,22); t='DIGIYLYFE'; bb=d.textbbox((0,0),t,font=f)
              d.text(((r[0]+r[2]-(bb[2]-bb[0]))/2,round(838*sy)),t,font=f,fill=gold)
              r2=R(58,1145,489,1236)
              d.rounded_rectangle(r2,radius=max(8,round(20*s)),fill=bg)
              f=F(fontb,22); t='RÉPONSE DIRECTE DU PROPRIÉTAIRE'; bb=d.textbbox((0,0),t,font=f)
              d.text(((r2[0]+r2[2]-(bb[2]-bb[0]))/2,round(1177*sy)),t,font=f,fill=white)
              d.rectangle(R(365,1302,500,1394),fill=beige)
              d.text((round(371*sx),round(1319*sy)),'PRIX DIRECT',font=F(fontb,17),fill=(22,45,36))
              d.text((round(371*sx),round(1350*sy)),'Confirmé par',font=F(font,13),fill=(22,45,36))
              d.text((round(371*sx),round(1369*sy)),'le propriétaire',font=F(font,13),fill=(22,45,36))
              im.save(p,optimize=True)

          idx=Path('index.html')
          text=idx.read_text(encoding='utf-8')
          text=text.replace('Fiche vérifiée DIGIY','ADHÉRENT DIGIYLYFE')
          text=re.sub(r'verified:"[^"]*"','verified:"ADHÉRENT DIGIYLYFE"',text)
          text=text.replace('.score-badge{','.score-badge{display:none!important;')
          idx.write_text(text,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "DIGIYLYFE Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "carte de visite.png" carte-chez-baptiste-qr.png index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Chez Baptiste : adhérent DIGIYLYFE"
          git push
