name: DIGIY return once
on:
  push:
    paths:
      - '.github/workflows/digiy-return-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add DIGIYLYFE return
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='data-digiy-return-home="1"'
          button='''<a data-digiy-return-home="1" href="https://digiylyfe.com/" aria-label="Retour à DIGIYLYFE" style="position:relative;z-index:9999;display:flex;align-items:center;justify-content:center;gap:10px;width:min(460px,calc(100% - 28px));min-height:58px;box-sizing:border-box;margin:14px auto;padding:12px 18px;border:2px solid #111;border-radius:14px;background:#fff;color:#111;text-decoration:none;font:950 17px/1.1 system-ui,-apple-system,'Segoe UI',sans-serif;box-shadow:0 5px 16px rgba(0,0,0,.14);-webkit-tap-highlight-color:transparent"><span aria-hidden="true" style="font-size:26px;line-height:1">←</span><strong>RETOUR DIGIYLYFE</strong></a>'''
          if marker not in s:
              m=re.search(r'<body[^>]*>',s,re.I)
              if not m: raise SystemExit('No body tag')
              s=s[:m.end()]+'\n'+button+s[m.end():]
          else:
              s=re.sub(r'<a\s+data-digiy-return-home="1".*?</a>',button,s,count=1,flags=re.I|re.S)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "DIGIYLYFE Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/digiy-return-once.yml
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Poser retour DIGIYLYFE"
          git push
