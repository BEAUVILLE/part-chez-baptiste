name: Brancher Chez Baptiste Saly au MASTER LOC

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-master-loc-saly.py'
      - 'tools/patch-owner-price-layout-saly.py'
      - 'tools/patch-special-price-range-saly.py'
      - '.github/workflows/apply-master-loc-saly.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-master-loc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Raccorder états et tarifs au MASTER LOC
        run: python3 tools/patch-master-loc-saly.py
      - name: Ajuster le rendu propriétaire
        run: python3 tools/patch-owner-price-layout-saly.py
      - name: Préserver les forfaits hors prix spéciaux
        run: python3 tools/patch-special-price-range-saly.py
      - name: Publier le raccordement
        run: |
          if git diff --quiet -- index.html gestion.html; then
            echo "Aucune modification à publier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html gestion.html
          git commit -m "Verrouiller Chez Baptiste Saly sur le MASTER LOC"
          git push
