name: Supprimer injection accès propriétaire Saly
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-owner-injection.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retirer injection JavaScript propriétaire
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile-compact.js')
          s=p.read_text()
          old='    injectOwnerAccess();\n'
          if old not in s:
              raise SystemExit('appel injectOwnerAccess introuvable')
          p.write_text(s.replace(old,'',1))
          PY
      - name: Vérifier
        run: |
          ! grep -q '^    injectOwnerAccess();$' mobile-compact.js
      - name: Commit
        run: |
          git config user.name 'DIGIY LYFE'
          git config user.email 'baptistejb24@gmail.com'
          git add mobile-compact.js
          git commit -m 'Retirer définitivement accès propriétaire public Saly'
          git push
